name: interpreter

on:
  push:
  pull_request:

jobs:
  test:
    name: Luau bytecode interpreter
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: check the bundle matches src
      run: python3 tools/bundle.py --check
    - name: check out Luau (CLI, compiler and conformance tests)
      uses: actions/checkout@v4
      with:
        repository: premiumfrog/Lua-
        ref: master
        path: luau
    - name: build luau and luau-compile
      run: make -C luau -j4 config=release luau luau-compile
    - name: run interpreter tests (conformance + tests/unit, O0-O2, fast and debug, src and bundled)
      run: python3 tests/run.py luau/luau luau/luau-compile --luau-source luau
